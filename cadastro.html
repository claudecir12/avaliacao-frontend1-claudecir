<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="favicon-tecboard-dark.svg" type="image/svg+xml">
    <title>Tecboard - Cadastro</title>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="img/logo-tecboard-branco.png" alt="Logo Tecboard na cor branca">
        </a>
    </header>

    <main>
        <section id="cadastro">
            <h2>Solicite seu Acesso e Configure sua Aplicação</h2>

            <form action="#" method="post">
                <!-- Construa os blocos de fieldset do formulário aqui -->

                <fieldset>
                    <legend>Dados Pessoais:</legend>
                    <label for="userName">Nome:</label>
                    <input type="text" name="userName" required>
                    <br>

                    <label for="userAge">Idade:</label>
                <input type="number" name="userAge" required min="12" max="100">

                <br>

                <label for="userBirthDate">Data de Solicitação:</label>
                <input type="date" name="userBirthDate">
                <br>

               <label for="userEmail">Email Corporativo:</label>
                <input type="email" name="userEmail" required>
                <br>

                <label for="userPhoneNumber">Telefone de plantão:</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{49}" placeholder="99999999999">
                <br>

                <label for="userImage">Logotipo da aplicação:</label>
                <input type="file" accept="image/*" name="userImage">
                <br>

                <br>

                <fieldset>

                    


                </fieldset>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
